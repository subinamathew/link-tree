# Netlify Production Configuration
# Standards: Static JAMstack / 11ty + Storyblok Headless CMS
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "_site"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --prefer-offline"
  SECRETS_SCAN_ENABLED = "true"

# Asset optimization and post-processing
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# Context-specific overrides
[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# ------------------------------------------------------------------------------
# Security & Privacy Headers (GDPR / DSGVO & Storyblok Visual Editor Compliant)
# ------------------------------------------------------------------------------

# Root / Default Security Policy for all routes
[[headers]]
  for = "/*"
  [headers.values]
    # Modern Content Security Policy:
    # - default-src 'self': Restrict resources to same-origin by default
    # - img-src: Self, inline data URIs, and Storyblok Asset CDN (https://a.storyblok.com)
    # - style-src: Self and inline styles for critical CSS and color tokens
    # - script-src: Self and Storyblok Bridge (https://app.storyblok.com) for visual editor
    # - frame-src: Self and YouTube embeds (https://www.youtube.com, https://www.youtube-nocookie.com)
    # - frame-ancestors: Allows iframe embedding only from self and Storyblok (https://app.storyblok.com)
    # - object-src 'none': Disallow Flash/Java plugins
    # - base-uri 'self': Prevent base tag injection
    # - form-action 'self': Prevent malicious form submissions
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://a.storyblok.com https://*.storyblok.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://app.storyblok.com https://*.storyblok.com; connect-src 'self' https://api.storyblok.com https://gapi.storyblok.com https://app.storyblok.com https://*.storyblok.com wss://*.storyblok.com; frame-src 'self' https://www.youtube-nocookie.com; frame-ancestors 'self' https://app.storyblok.com https://*.storyblok.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"
    
    # MIME-sniffing protection
    X-Content-Type-Options = "nosniff"
    
    # Modern Referrer Policy: Send full referrer on same-origin, domain-only on cross-origin HTTPS
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Restrict sensitive browser APIs & trackers (no camera, microphone, geolocation, FLoC)
    Permissions-Policy = "accelerometer=(), autoplay=(self \"https://www.youtube-nocookie.com\"), camera=(), cross-origin-isolated=(), display-capture=(), encrypted-media=(self \"https://www.youtube-nocookie.com\"), fullscreen=(self \"https://www.youtube-nocookie.com\"), geolocation=(), gyroscope=(), keyboard-map=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(self \"https://www.youtube-nocookie.com\"), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=(), browsing-topics=()"
    
    # Enforce HTTPS with 1 year HSTS and preloading
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # Process isolation and cross-origin protection
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Permitted-Cross-Domain-Policies = "none"
    
    # Default HTML caching: revalidate immediately on new deploys
    Cache-Control = "public, max-age=0, must-revalidate"

# ------------------------------------------------------------------------------
# High-Performance Immutable Static Asset Caching
# ------------------------------------------------------------------------------

# Static compiled CSS stylesheets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images, icons, and client assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Standalone SVG files
[[headers]]
  for = "/*.svg"
  [headers.values]
    Content-Type = "image/svg+xml"
    Cache-Control = "public, max-age=31536000, immutable"

# Standalone Favicon
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# ------------------------------------------------------------------------------
# Routing & Fallbacks
# ------------------------------------------------------------------------------

# Fallback for unmatched routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
